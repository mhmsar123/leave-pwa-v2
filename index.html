<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>نظام استئذان الموظفين</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon"
        href="https://cdn.jsdelivr.net/gh/mhmsar123/app-icons/icon-192x192.png">
  <link rel="icon"
        href="https://cdn.jsdelivr.net/gh/mhmsar123/app-icons/icon-192x192.png"
        type="image/png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="استئذان المدرسة">
  <meta name="theme-color" content="#1976d2">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #f3f6f9;
    }
    iframe {
      width: 100%; height: 100%;
      border: 0; display: block;
    }

    /* شريط التثبيت المخصص - نتحكم في مكان الأزرار لتفادي الضغط بالغلط على الإغلاق */
    #installBanner {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: #ffffff;
      box-shadow: 0 -3px 16px rgba(0,0,0,.28);
      border-radius: 18px 18px 0 0;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      z-index: 9999;
      display: none;
      font-family: system-ui, sans-serif;
    }
    #installBanner.show { display: block; }
    #installHead {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    #installHead img {
      width: 46px; height: 46px;
      border-radius: 12px;
      flex: 0 0 auto;
    }
    #installHead .txt {
      flex: 1;
      font-size: 15px;
      color: #1a1a1a;
      line-height: 1.45;
    }
    #installClose {
      border: 0;
      background: #f0f0f0;
      width: 36px; height: 36px;
      border-radius: 50%;
      font-size: 22px;
      line-height: 1;
      color: #666;
      cursor: pointer;
      flex: 0 0 auto;
    }
    #installBtn {
      display: block;
      width: 100%;
      background: #1976d2;
      color: #fff;
      border: 0;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    #installLater {
      display: block;
      width: 100%;
      margin-top: 10px;
      background: transparent;
      color: #777;
      border: 0;
      padding: 10px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="installBanner" dir="rtl">
    <div id="installHead">
      <img src="https://cdn.jsdelivr.net/gh/mhmsar123/app-icons/icon-192x192.png" alt="">
      <div class="txt">ثبّت التطبيق على شاشتك الرئيسية للوصول السريع</div>
      <button id="installClose" aria-label="إغلاق">&#215;</button>
    </div>
    <button id="installBtn">تثبيت التطبيق</button>
    <button id="installLater">لاحقاً</button>
  </div>

  <iframe id="appFrame"
          src="about:blank"
          title="نظام استئذان الموظفين"
          allow="camera; microphone; geolocation; clipboard-read; clipboard-write"></iframe>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var app = params.get('app');
      var frame = document.getElementById('appFrame');
      if (app) {
        frame.src = app;
      } else {
        frame.src = 'https://script.google.com/macros/s/AKfycbxluPchFeZ59leJpwXshW9yKrRQs0EPTZho6o8RwXvCq-j91y-YjKHaGSm_cfFugEAi/exec';
      }
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('SW registration failed:', e);
        });
      });
    }

    // شريط تثبيت مخصص: نمنع الـ prompt الأصلي (اللي أزراره متلخبطة) ونعرض بتاعنا
    var deferredPrompt = null;
    var banner = document.getElementById('installBanner');
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      banner.classList.add('show');
    });
    document.getElementById('installBtn').addEventListener('click', function () {
      if (!deferredPrompt) { banner.classList.remove('show'); return; }
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(function () {
        deferredPrompt = null;
        banner.classList.remove('show');
      });
    });
    document.getElementById('installClose').addEventListener('click', function () {
      banner.classList.remove('show');
    });
    document.getElementById('installLater').addEventListener('click', function () {
      banner.classList.remove('show');
    });
  </script>
</body>
</html>
